# Point a local Spring Boot process at staging or production MySQL.
# Do NOT commit real passwords. Set them in the shell or IntelliJ env vars.
#
#   --spring.profiles.active=remote
#
# Prefer staging. Production from a laptop can alter live data if misconfigured.

server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Do not change remote schema from a laptop.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
app.site.url=${SITE_URL:http://localhost:3000}

# Never seed or rewrite categories/users against a shared database.
app.seed-data=false

# Google login only succeeds if that email already exists in the remote users table.
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.require-existing-user=${OAUTH_REQUIRE_EXISTING_USER:true}

file.upload-dir=${FILE_UPLOAD_DIR:uploads}
