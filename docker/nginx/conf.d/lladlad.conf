# ── Redirect HTTP → HTTPS ─────────────────────────────────────────
server {
    listen 80;
    server_name lladlad.com www.lladlad.com api.lladlad.com;
    return 301 https://$host$request_uri;
    # 301 = permanent redirect
    # $host = whatever domain the visitor typed (lladlad.com, www.lladlad.com etc)
    # $request_uri = the path they requested (/blog/post-1 etc)
}

# ── React Frontend ────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name lladlad.com www.lladlad.com;

    # Cloudflare origin certificate (generated in Phase 5)
    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;

    # React build files are copied here in Dockerfile.nginx
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
        # try_files = look for the requested file on disk
        # If not found → serve index.html (required for React Router)
        # Without this, refreshing /blog/my-post gives a 404
    }

    # Cache static assets aggressively (JS/CSS/images don't change)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Browser caches these for 1 year — faster repeat visits
    }
}

# ── Spring Boot API ───────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.lladlad.com;

    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;

    location / {
        proxy_pass http://backend:8080;
        # Forward request to the backend container
        # "backend" = Docker container name (resolves automatically on internal network)
        # 8080 = the port Spring Boot listens on inside the container

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # These headers pass the visitor's real IP to Spring Boot
        # Without them, Spring Boot sees all requests coming from nginx, not the user

        proxy_read_timeout 300s;
        # Wait up to 5 minutes for backend response (important for slow API calls)
    }
}
